<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inventory System{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: #2f3136;
            color: #fff;
            padding: 20px;
        }

        .sidebar h2 {
            color: #fff;
            font-size: 22px;
            margin: 0 0 20px;
        }

        .sidebar a {
            display: block;
            color: #e5e7eb;
            text-decoration: none;
            padding: 10px 12px;
            margin: 4px 0;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background: #44474e;
        }

        .sidebar a.active {
            background: #4b5563;
            color: #fff;
        }

        .content {
            flex: 1;
            min-width: 0;
            padding: 24px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ff828295;
            text-align: center;
        }

        th {
            background: #272829;
            color: #fff;
        }

        button {
            padding: 6px 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input {
            width: 70px;
            padding: 4px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>📦 Inventory</h2>
        <a class="{% if request.path == '/dashboard/' %}active{% endif %}" href="{% url 'dashboard' %}">Dashboard</a>
        <a class="{% if request.path == '/products/' %}active{% endif %}" href="{% url 'products' %}">Products</a>
        <a class="{% if request.path == '/sales/' %}active{% endif %}" href="{% url 'sales' %}">Sales</a>
        <a class="{% if request.path == '/alerts/' %}active{% endif %}" href="{% url 'alerts' %}">Alerts 🔔</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>

    <!-- PAGE CONTENT -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</div>

</body>
</html>
